# =====================================================================
# frontend / nginx.conf
# Sirve la web (login + buscador) y reenvia /api/ al contenedor de la API.
# Es la UNICA puerta abierta al exterior; los demas contenedores son internos.
# =====================================================================

# Zona para limitar intentos de login: 10 por minuto por cada IP (frena ataques de fuerza bruta)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;                                   # puerto interno del contenedor (afuera es 8080)
    server_tokens off;                           # no revela la version de Nginx en errores ni cabeceras
    root /usr/share/nginx/html;                  # carpeta con los archivos de la web
    index index.html;                            # pagina inicial
    client_max_body_size 16k;                    # rechaza cuerpos grandes (login y registro son pequenos)

    # En el servidor, Caddy esta delante: tomamos la IP real del usuario que Caddy informa,
    # asi el limite de intentos de login cuenta por persona y no por "Caddy".
    set_real_ip_from 172.16.0.0/12;              # rango de las redes internas de Docker
    set_real_ip_from 10.0.0.0/8;                 # otros rangos privados posibles
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;              # cabecera donde Caddy pone la IP del usuario
    real_ip_recursive on;                        # toma la ultima IP que no sea de confianza

    # ---------- Paginas y archivos de la web ----------
    location / {
        try_files $uri $uri/ =404;               # sirve el archivo si existe; si no, 404
        # Politica de seguridad de contenido: solo se ejecuta codigo de nuestro propio sitio
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;       # el navegador no adivina tipos de archivo
        add_header X-Frame-Options "DENY" always;                 # nadie puede incrustar la pagina (clickjacking)
        add_header Referrer-Policy "no-referrer" always;          # no filtra la URL a otros sitios
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;  # sin permisos del dispositivo
    }

    # ---------- Login: misma ruta hacia la API, pero con limite de intentos ----------
    location = /api/login {
        limit_req zone=login burst=5 nodelay;    # permite rafagas cortas; despues responde 429
        limit_req_status 429;                    # codigo "demasiadas peticiones"
        proxy_pass http://api:8000/login;        # reenvia a la ruta /login de la API
        proxy_set_header Host $host;             # conserva el host original
        proxy_set_header X-Real-IP $remote_addr; # IP real del usuario (para registros)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # cadena de proxies
        proxy_set_header X-Forwarded-Proto $scheme;                   # http o https
    }

    # ---------- Resto de la API (busqueda, registro, Swagger en /api/docs) ----------
    location /api/ {
        proxy_pass http://api:8000/;             # "api" es el nombre del servicio en docker-compose
        proxy_set_header Host $host;             # conserva el host original
        proxy_set_header X-Real-IP $remote_addr; # IP real del usuario
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # cadena de proxies
        proxy_set_header X-Forwarded-Proto $scheme;                   # http o https
        proxy_read_timeout 10s;                  # si la API no responde en 10 s, se corta
    }
}
